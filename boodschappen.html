<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        // Dictionary: lijst key-value paren
        // melk: 1.95
        // brood: 0.85
        // kassabon

        var prijzen = {
            'Melk': 1.78,
            'Brood': 0.95,
            'Appel': 0.65
        }

        var totaal = 0;

        function koop(product)
        {
            totaal += prijzen[product];
            document.getElementById('totaal').innerHTML = `De totaalprijs is ${totaal.toFixed(2)} euro`;
            var item = document.createElement('li');
            item.innerHTML = product;
            document.getElementById('boodschappen').append(item);
        }

    </script>
</head>
<body>
    <h1>Supermarkt</h1>

    <button onclick="koop('Melk')">Koop melk</button>
    <button onclick="koop('Brood')">Koop brood</button>
    <button onclick="koop('Appel')">Koop appel</button>

    <ul id="boodschappen"></ul>

    <p id="totaal">
        De totaalprijs is 0.00 euro.
    </p>

</body>
</html>
