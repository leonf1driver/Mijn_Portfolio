<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albert Heijn Checkout</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Nunito:wght@400;700;800&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0f4f8; /* Fresh light blue-grey */
            color: #333;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            font-weight: 800;
            color: #00AEEF; /* AH Blue */
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        #knoppen {
            margin-bottom: 50px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        button {
            background-color: #fff;
            color: #00AEEF;
            border: 2px solid #00AEEF;
            padding: 10px 20px;
            border-radius: 20px; /* AH uses rounded pill shapes often */
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 4px rgba(0, 174, 239, 0.1);
        }

        button:hover {
            background-color: #00AEEF;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 174, 239, 0.3);
        }

        button:active {
            transform: translateY(1px);
            box-shadow: 0 1px 2px rgba(0, 174, 239, 0.2);
        }

        /* The Receipt Container */
        .receipt-wrapper {
            background-color: #fff;
            color: #000;
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
            padding: 25px 20px 40px 20px;
            border-radius: 4px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-top: 5px solid #00AEEF; /* AH top accent */
            font-family: 'Space Mono', monospace;
            position: relative;
            text-align: left;
        }

        .receipt-header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px dashed #999;
            padding-bottom: 15px;
        }

        .receipt-header h2 {
            margin: 0;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 32px;
            color: #00AEEF;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .receipt-header p {
            margin: 5px 0 0;
            font-size: 11px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            color: #666;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-bottom: 20px;
        }

        th {
            border-bottom: 1px dashed #999;
            padding: 8px 0;
            font-weight: normal;
            text-transform: uppercase;
            font-size: 11px;
            color: #666;
        }

        td {
            padding: 6px 0;
        }

        table tr:not(:first-child) {
            border-bottom: none;
        }

        th:nth-child(3), th:nth-child(5) {
            color: transparent;
        }

        td:nth-child(1) { text-align: left; width: 12%; font-weight: bold; } /* aantal */
        td:nth-child(2) { text-align: left; width: 43%; } /* product */
        td:nth-child(3) { text-align: right; width: 5%; color: #888; } /* euro sign */
        td:nth-child(4) { text-align: right; width: 15%; } /* prijs */
        td:nth-child(5) { text-align: right; width: 5%; color: #888; } /* euro sign */
        td:nth-child(6) { text-align: right; width: 20%; font-weight: bold; } /* totaal */

        /* Highlight the non-zero rows */
        .row-active {
            color: #000;
        }
        .row-inactive {
            display: none; /* Hide inactive rows for cleaner receipt */
        }

        #totaalprijs {
            font-family: 'Space Mono', monospace;
            font-size: 20px;
            font-weight: bold;
            text-align: right;
            border-top: 1px dashed #999;
            padding-top: 15px;
            margin: 0;
            color: #000;
        }

        .barcode {
            margin-top: 30px;
            text-align: center;
        }
        
        .barcode-lines {
            height: 40px;
            background: repeating-linear-gradient(
                90deg,
                #000,
                #000 2px,
                transparent 2px,
                transparent 4px,
                #000 4px,
                #000 7px,
                transparent 7px,
                transparent 10px,
                #000 10px,
                #000 11px,
                transparent 11px,
                transparent 16px
            );
            margin-bottom: 5px;
            width: 70%;
            margin-left: auto;
            margin-right: auto;
            opacity: 0.8;
        }

        .barcode p {
            font-size: 11px;
            margin: 0;
            letter-spacing: 5px;
            color: #555;
            font-family: 'Space Mono', monospace;
        }

        .btn-reset {
            margin-top: 40px;
            background-color: transparent;
            color: #00AEEF;
            border: 2px solid #00AEEF;
            padding: 10px 20px;
            box-shadow: none;
            border-radius: 20px;
        }
        .btn-reset:hover {
            background-color: #00AEEF;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 174, 239, 0.2);
        }
    </style>

    <script>
        var prijslijst = {
            'Brood': 0.98,
            'Melk': 1.05,
            'Appels': 2.50,
            'Sinas': 1.79,
            'Spinazie': 2.50,
            'Wijn': 7.98,
            'Shampoo': 4.69
        };

        var karretje = {};

        function init() {
            var dateElem = document.getElementById('receipt-date');
            if (dateElem) {
                var today = new Date();
                dateElem.innerHTML = today.toLocaleDateString('nl-NL');
            }

            for (let product in prijslijst) {
                var btn = document.createElement('button');
                btn.innerHTML = "+ " + product;
                btn.onclick = () => koop(product);
                document.getElementById('knoppen').append(btn);
            }
            reset();
        }

        function reset() {
            for (let product in prijslijst) {
                karretje[product] = 0;
            }
            toonKassabon();
        }

        function koop(product) {
            karretje[product]++;
            toonKassabon();
        }

        function toonKassabon() {
            var totaal = 0;
            var tbl = document.createElement('table');

            addHeaders(tbl, ['Aantal', 'Product', '', 'Prijs', '', 'Totaal']);

            for (let product in prijslijst) {
                var row = document.createElement('tr');
                if (karretje[product] > 0) {
                    row.className = 'row-active';
                } else {
                    row.className = 'row-inactive';
                }

                var colAantal = document.createElement('td');
                colAantal.innerHTML = karretje[product] + 'x';
                row.append(colAantal);

                var colProduct = document.createElement('td');
                colProduct.innerHTML = product;
                row.append(colProduct);

                var colEuro1 = document.createElement('td');
                colEuro1.innerHTML = '&euro;';
                row.append(colEuro1);

                var colPrijs = document.createElement('td');
                colPrijs.innerHTML = prijslijst[product].toFixed(2);
                row.append(colPrijs);

                var colEuro2 = document.createElement('td');
                colEuro2.innerHTML = '&euro;';
                row.append(colEuro2);

                var colSubtotaal = document.createElement('td');
                var subtotaal = prijslijst[product] * karretje[product];
                totaal += subtotaal;
                colSubtotaal.innerHTML = subtotaal.toFixed(2);
                row.append(colSubtotaal);

                tbl.append(row);
            }

            document.getElementById('producten').innerHTML = '';
            document.getElementById('producten').append(tbl);
            document.getElementById('totaalprijs').innerHTML = `TOTAAL: &euro; ${totaal.toFixed(2)}`;
        }

        function addHeaders(tbl, titles) {
            var row = document.createElement('tr');
            for (var t of titles) {
                var th = document.createElement('th');
                th.innerHTML = t;
                row.append(th);
            }
            tbl.append(row);
        }
    </script>
</head>

<body onload="init();">

    <h1>Boodschappen Scanner</h1>

    <div id="knoppen"></div>

    <div class="receipt-wrapper">
        <div class="receipt-header">
            <h2>ALBERT HEIJN</h2>
            <p>Dat is het lekkere van Albert Heijn<br>Datum: <span id="receipt-date"></span></p>
        </div>

        <div id="producten"></div>

        <div id="totaalprijs">TOTAAL: &euro; 0.00</div>

        <div class="barcode">
            <div class="barcode-lines"></div>
            <p>8710400311234</p>
        </div>
    </div>

    <button class="btn-reset" onclick="reset()">Nieuwe Klant (Reset)</button>

</body>

</html>
