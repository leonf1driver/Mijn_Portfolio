<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>

        var landen = ['Nederland', 'Belgie', 'Frankrijk', 'Duitsland', 'Engeland'];

        // sorteren
        landen.push('Luxemburg');

        landen.sort();

        landen.reverse();

        // filteren met een arrow function (lambda function)
        var result = landen.filter(land => land.toLowerCase().includes('ne'));

        console.log(result);

    </script>

</head>

</html>
